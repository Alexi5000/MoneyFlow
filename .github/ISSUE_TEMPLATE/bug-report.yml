name: Bug report
description: Report a reproducible MoneyFlow defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for improving MoneyFlow. Do not include credentials, bank data, account numbers, personal financial records, or security-sensitive details in this form.
  - type: textarea
    id: summary
    attributes:
      label: Observed behavior
      description: Describe what happened and the user or API impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence of commands, route calls, or interface actions that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Open or request ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Provide OS, Node.js, Python, and browser versions where relevant.
      placeholder: Ubuntu 24.04, Node 22, Python 3.12, Chromium 139
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed personal financial information, credentials, and security-sensitive details from this report.
          required: true
